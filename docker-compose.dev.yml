# docker-compose for LOCAL DEV ONLY
# Only runs infrastructure services (DB + Storage emulator)
# Backend & Frontend run directly on host for easier debugging
#
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: photomap
      POSTGRES_PASSWORD: photomap
      POSTGRES_DB: photomap
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photomap"]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_dev:/data
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 -l /data"

volumes:
  pgdata_dev:
  azurite_dev:
